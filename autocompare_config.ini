# Cấu hình AutoCompare.
# Chỉnh file này khi cần đổi tên folder, tên workbook output hoặc label trong Excel.

[folders]
# Dùng khi chạy so sánh: folder CSV nguồn bên trong mỗi case UT*.
input_dir = Input

# Dùng khi chạy so sánh: folder output cha bên trong mỗi case UT*.
output_dir = Output

# Dùng khi chạy so sánh: folder chứa file Excel compare output.
compare_dir = Compare

# Dùng cho luồng so sánh trước/sau của HTM và bước sao chép từ Input.
# HTM = folder output của hệ thống mới.
before_htm_dir = before新システム出力データ

# Dùng cho luồng so sánh trước/sau của HTM và luồng so sánh sau/sau.
# HTM = folder output của hệ thống mới.
after_htm_dir = after新システム出力データ

# Dùng cho luồng so sánh trước/sau của HTC và bước sao chép từ Input.
# HTC = folder output của hệ thống hiện hành/cũ.
before_htc_dir = before現行システム出力データ

# Dùng cho luồng so sánh trước/sau của HTC và luồng so sánh sau/sau.
# HTC = folder output của hệ thống hiện hành/cũ.
after_htc_dir = after現行システム出力データ

[workbooks]
# File output cho checkbox "So sánh trước/sau của HTM".
htm_before_after_file = Compare新_Before_After.xlsx

# File output cho checkbox "So sánh trước/sau của HTC".
htc_before_after_file = Compare現行_Before_After.xlsx

# File output cho checkbox "So sánh sau/sau giữa HTC và HTM".
after_htc_vs_htm_file = Compare現行_vs_新_After_After.xlsx

[excel_headers]
# Tiêu đề ô A1: tổng số cột có ít nhất một sai khác.
diff_count_title = 差分行数

# Label dòng 2 cột A: tên cột từ CSV bên trái.
left_column_title = 前列名

# Label dòng 2 cột B: tên cột từ CSV bên phải.
right_column_title = 後列名

# Prefix record ở dòng 2 cho value bên trái.
left_record_prefix = 前

# Prefix record ở dòng 2 cho value bên phải.
right_record_prefix = 後

# Text ghi ở cột cuối khi phát hiện sai khác.
fixme_text = FIXME

# Message ghi vào workbook compare khi không tìm thấy file CSV.
no_csv_message = Không tìm thấy file CSV trong folder so sánh.

[compare_workflows]
# Trạng thái chọn mặc định cho "So sánh trước/sau của HTM".
htm_before_after_enabled = true

# Trạng thái chọn mặc định cho "So sánh trước/sau của HTC".
htc_before_after_enabled = true

# Trạng thái chọn mặc định cho "So sánh sau/sau giữa HTC và HTM".
after_htc_vs_htm_enabled = true
