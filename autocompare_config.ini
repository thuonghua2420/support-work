# Cấu hình AutoCompare.
# Chỉnh file này khi cần đổi tên folder, tên workbook xuất ra hoặc label trong Excel.

[folders]
# Tên hoặc mẫu tên folder case. Ví dụ: UT*, Case*, Test_?? hoặc tên chính xác.
case_pattern = UT*

# Dùng khi chạy so sánh: folder CSV nguồn bên trong mỗi case UT*.
input_dir = 入力データ

# Dùng khi chạy so sánh: folder xuất ra cha bên trong mỗi case UT*.
output_dir = 出力（登録・更新）データ

# Dùng khi chạy so sánh: folder chứa file Excel compare xuất ra.
compare_dir = Compare

# Dùng cho luồng so sánh trước/sau của HTM và bước sao chép từ Input.
# HTM = folder xuất ra của hệ thống mới.
before_htm_dir = before新システム出力データ

# Dùng cho luồng so sánh trước/sau của HTM và luồng so sánh sau/sau.
# HTM = folder xuất ra của hệ thống mới.
after_htm_dir = after新システム出力データ

# Dùng cho luồng so sánh trước/sau của HTC và bước sao chép từ Input.
# HTC = folder xuất ra của hệ thống hiện hành/cũ.
before_htc_dir = before現行システム出力データ

# Dùng cho luồng so sánh trước/sau của HTC và luồng so sánh sau/sau.
# HTC = folder xuất ra của hệ thống hiện hành/cũ.
after_htc_dir = after現行システム出力データ

[workbooks]
# File xuất ra cho checkbox "So sánh trước/sau của HTM".
htm_before_after_file = Compare新_Before_After.xlsx

# File xuất ra cho checkbox "So sánh trước/sau của HTC".
htc_before_after_file = Compare現行_Before_After.xlsx

# File xuất ra cho checkbox "So sánh sau/sau giữa HTC và HTM".
after_htc_vs_htm_file = Compare新-現行_After.xlsx

# Tên file xuất ra mặc định cho menu "So sánh 2 folder CSV".
folder_compare_file = Compare_2_Folder_CSV.xlsx

[excel_headers]
# Tiêu đề ô A1: tổng số cột có ít nhất một sai khác.
diff_count_title = 差分行数

# Label dòng 2 cột A: tên cột từ CSV bên trái.
left_column_title = 前列名

# Label dòng 2 cột B: tên cột từ CSV bên phải.
right_column_title = 後列名

# Prefix record ở dòng 2 cho value bên trái.
left_record_prefix = 前

# Prefix record ở dòng 2 cho value bên phải.
right_record_prefix = 後

# Text ghi ở cột cuối khi phát hiện sai khác.
fixme_text = FIXME

# Message ghi vào workbook compare khi không tìm thấy file CSV.
no_csv_message = Không tìm thấy file CSV trong folder so sánh.

[excel_headers_htm_before_after]
# Header cho file htm_before_after_file.
left_column_title = 前列名
right_column_title = 後列名
left_record_prefix = 前
right_record_prefix = 後

[excel_headers_htc_before_after]
# Header cho file htc_before_after_file.
left_column_title = 前列名
right_column_title = 後列名
left_record_prefix = 前
right_record_prefix = 後

[excel_headers_after_htc_vs_htm]
# Header cho file after_htc_vs_htm_file.
# Compare theo folder cũng dùng bộ header này.
left_column_title = 前列名
right_column_title = 後列名
left_record_prefix = 前
right_record_prefix = 後

[excel_compare_style]
# Màu trong file Excel compare. Dùng mã hex dạng RRGGBB hoặc AARRGGBB.

# Font thường dùng cho các cell value.
base_font_color = 000000

# Font header dòng 2.
header_font_color = 006100

# Font dùng cho các cell sai khác.
diff_font_color = FF0000

# Font dùng cho ô A1.
a1_font_color = 9C0006

# Font của cell FIXME.
fixme_font_color = 000000

# Fill ô A1.
a1_fill_color = FFC7CE

# Fill header dòng 2.
header_fill_color = C6EFCE

# Fill cột tên field bên trái/phải.
name_fill_color = E2EFDA

# Fill các cell có sai khác.
diff_fill_color = E5CCFF

[update_compare_keys]
customer_data = customer_id
financial_transactions = transaction_id
hr_employee_data = employee_id
product_inventory = product_sku

[compare_workflows]
# Copy Input CSVs into both before folders only when enabled.
copy_input_enabled = false
# Sort CSV records in place using the configured table keys before comparing.
sort_by_key_enabled = false
# Trạng thái chọn mặc định cho "So sánh trước/sau của HTM".
htm_before_after_enabled = true

# Trạng thái chọn mặc định cho "So sánh trước/sau của HTC".
htc_before_after_enabled = true

# Trạng thái chọn mặc định cho "So sánh sau/sau giữa HTC và HTM".
after_htc_vs_htm_enabled = true

[excel_image_format]
# Marker trong tên sheet sẽ bị bỏ qua khi căn ảnh. Các chuỗi mojibake bên dưới
# được giữ lại vì sample.vba đang chứa text Nhật bị lỗi encoding.
excluded_sheet_markers = 変更履歴, サンプル, å¤‰æ›´å±¥æ­´, ã‚µãƒ³ãƒ—ãƒ«, â€¢ÃÂXâ€”Å¡â€”Ã°, Æ’TÆ’â€œÆ’vÆ’â€¹

# Tên shape được xem là ảnh. Excel tiếng Anh thường là Picture; Excel tiếng Nhật
# thường là 図. Chuỗi mojibake Â} tương ứng với marker ảnh trong sample.vba.
shape_name_markers = picture, 図, Â}

# Marker cột A dùng để chia vùng ảnh. Nếu workbook dùng text khác, chỉnh ở đây.
input_marker = Input
steps_marker = Steps
output_marker = Output
marker_column = 1

# Phân vùng theo cột dựa trên ô góc trên bên trái của ảnh:
# hệ thống cũ từ A đến R; hệ thống mới từ S trở đi.
left_group_start_column = 1
left_group_end_column = 18
right_group_start_column = 19

# Vị trí đặt ảnh sau khi resize trong phần hệ thống cũ và hệ thống mới.
left_anchor_column = 2
right_anchor_column = 21

# Size chuẩn của ảnh, lấy theo chiều rộng range và giữ nguyên tỷ lệ ảnh.
left_width_range = C1:S1
right_width_range = V1:AL1

# Layout cơ bản: ảnh đầu và cuối vùng cách header biên 2 row.
first_row_height = 25.5
first_column_width = 8.29
image_row_padding = 2
# Khoảng cách dọc giữa hai ảnh liên tiếp trong cùng một vùng, đơn vị pixel.
image_spacing_pixels = 60
value_scan_column_count = 10

# Border/header/background. Header/background đang tắt để tương thích sample,
# vì trong sample.vba hai hàm này đang bị comment.
draw_borders = true
draw_background = false
draw_header = false
header_fill_range = A1:AJ1
left_header_range = A1:R1
right_header_range = S1:AJ1
left_header_text = 現行システム
right_header_text = 新システム
header_fill_color = 11389944
header_font_size = 22
border_start_row = 5
separator_column = 20
right_border_column = 38
bottom_border_last_column = 38

[database_workspace]
# Number of records returned by each result/source page.
page_size = 100

# Hard server-side bound for a page requested by the browser.
max_page_size = 500

# Statement timeout in seconds. Set 0 when the driver should not enforce a timeout.
query_timeout_seconds = 120

# Write mode automatically expires and must be enabled again after this many minutes.
write_mode_timeout_minutes = 30

# Batch used while reading result sets and exporting CSV; data is never accumulated with fetchall().
export_batch_size = 5000

# Maximum temporary result-spool size for one SQL workspace.
workspace_spool_limit_mb = 512

[database]
# Enable multi-database mode by default for CSV import and export.
multi_database_default = false
